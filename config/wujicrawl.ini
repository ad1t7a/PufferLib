[base]
env_name = wujicrawl
checkpoint_interval = 100

[vec]
# mjwarp throughput scales with world count until SMs are truly full;
# 8192 ran ~0.6M SPS at 43/97 GB. If 16384 OOMs or gains <1.3x, revert
# (or trim nconmax/njmax in wujicrawl_warp.py's make_data call).
total_agents = 32768
num_buffers = 2
num_threads = 2

[env]
# 1000 steps x 8 ms = 8 s episodes
max_episode_len = 1000
# dt 0.004 x 2 = 8 ms control step (125 Hz); pairs with mjcf_right_crawl_rl.xml
decimation = 2
action_scale = 1.0

# reward
w_track = 1.0
# linear velocity-toward-command term (clipped at |cmd| in the kernel):
# the dominant term — this hand is passively stable, so progress must pay
# far more than sitting still under the sharp tracking kernel
w_vel = 4.0
w_alive = 0.1
w_action_rate = -0.01
w_ang_vel = -0.001
# penalty on RAW policy outputs beyond [-1,1]: prevents action-mean runaway
# (observed |mu|~38 -> 99% saturated bang-bang -> no learning signal).
# Huber-shaped in k_pre (quadratic to ex=2, then linear): a restoring
# gradient at any overshoot, unlike the old hard cap at 4.
# -0.02 let means settle at |mu|~3.2 (70% of joints pinned past the clamp,
# out of reach of sigma~0.2 noise -> those dims stop learning). Stronger
# wall keeps means near the boundary where exploration still bites.
w_overflow = -0.1
# joint-velocity limit penalty (bounded; free below 6 rad/s, cap 25/joint).
# At -0.05/cap 100 it reached -13/step and made suicide-by-flip optimal —
# it's a tax, not the economy.
w_qvel = -0.005
# one-time penalty on flip termination. The per-step reward is floored at 0
# in k_post (a terminal bootstraps V=0, so sustained negative income makes
# dying optimal); this is the only negative reward the policy can see.
w_flip = -10.0

# Commanded planar velocity, sampled per episode in POLAR form: speed
# uniform in [cmd_speed_lo, cmd_speed_hi], heading uniform in
# cmd_heading_deg +/- cmd_heading_jitter_deg.
#
# The speed FLOOR is the point of sampling this way. Drawing vx and vy
# independently from boxes (the old cmd_vx_lo/hi = +/-0.08, cmd_vy_max = 0.15)
# left 24% of episodes with |cmd| < 0.06 m/s, and under a sigma^2 = 0.002
# tracking kernel a near-zero command is maximized by freezing — a quarter of
# the batch was training the stand-still optimum every other term here exists
# to defeat.
# Keep cmd_speed_lo above ~0.06. Ceiling near the scripted inchworm's
# ~0.075 m/s sustained, with headroom.
cmd_speed_lo = 0.08
cmd_speed_hi = 0.15

# Y AXIS (-90 deg = -y). This is the flexor direction, and the reason is
# mechanical, not empirical luck: at the settled pose the wrist's body -z
# axis — where the fingers point — lies along world -y, so a y command is
# driven by the MCP/PIP/DIP flexors (MCP forcerange +/-2 N.m) pulling the
# palm toward planted fingertips. An x command runs across the knuckles and
# can only come from the abduction joints, forcerange +/-0.2 N.m — 10x
# weaker. Sweeping the sector to 180 gives omnidirectional commands; do that
# only after the y-only gait is solid.
cmd_heading_deg = -90
cmd_heading_jitter_deg = 30

# Frame the command and the tracked velocity live in.
#   0 = world   — heading is fixed relative to the world for the episode.
#   1 = heading — relative to the hand's own facing (the body axis that
#       pointed along world +x at the settled pose).
# World is the default only because it is what has been trained so far.
# Heading frame is the better task for a y command: nothing in this reward
# penalizes yaw drift (w_ang_vel taxes angular RATE, not heading error), so
# in world frame the gait's own yaw steadily rotates the commanded direction
# off the flexor axis that made y easy — the policy ends up fighting for the
# abduction direction it was moved off of. Try cmd_frame = 1.
cmd_frame = 0

# reset randomization: finger pose jitter (rad, clamped to limits) and a
# random planar base push (up to 0.5x this in m/s). Decorrelates the batch
# and gives early policies "already moving" states where progress pays.
reset_noise = 0.2

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
seed = 42
total_timesteps = 2_500_000_000
# 0.015 (the reach task's lr) diverged here: the reward is near-flat around
# the stand-still optimum, and at that lr the mean ran away between replayed
# updates (logstd +29, |mu|~1e5 by 500M steps). The trainer now also clamps
# the logstd param to [-4, 1] after every step (pufferlib.cu).
learning_rate = 0.002
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 20
max_grad_norm = 0.5
# 1e-5 dates from when the Gaussian head was unbounded (entropy bonus fed
# the sigma runaway). The trainer now clamps the logstd param to [-4, 1],
# and at 1e-5 sigma collapsed toward the floor by 262M steps (mean logstd
# -1.6 and falling) while the policy froze — the rate/qvel penalties tax
# noise and nothing sustains it. A real bonus is safe now; anneal to 10%.
ent_coef = 1e-03
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
horizon = 64
minibatch_size = 65536
replay_ratio = 2.0
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 0.4
prio_beta0 = 1.0

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 1e9
mean = 3e8
scale = auto

[sweep.env.w_alive]
distribution = log_normal
min = 0.01
max = 2.0
mean = 0.5
scale = auto
