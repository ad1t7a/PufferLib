[base]
env_name = wuji

[vec]
total_agents = 1024
num_buffers = 8
num_threads = 8

[env]
max_episode_len = 500
# dt 0.004 x 2 = 8 ms control step (125 Hz); pairs with the _rl.xml model
decimation = 2
action_scale = 1.0
w_reach = 1.0
w_action_rate = -0.01
success_radius = 0.02

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
seed = 42
total_timesteps = 100_000_000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.97
gae_lambda = 0.9
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 20
max_grad_norm = 0.5
ent_coef = 1e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
horizon = 64
minibatch_size = 16384
replay_ratio = 2.0
vtrace_rho_clip = 3.0
vtrace_c_clip = 3.0
prio_alpha = 0.4
prio_beta0 = 1.0

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 3e8
mean = 1e8
scale = auto
